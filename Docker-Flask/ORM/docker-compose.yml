version: '3.8'

services:
  web:
    # Construir usando el Dockerfile del directorio actual (.)
    build: .
    container_name: flask_login_backend

    # Mapeo de puertos: Puerto PC : Puerto Contenedor
    ports:
      - "5001:5000"

    # Variables de entorno. SECRET_KEY se toma del archivo .env (no versionado,
    # ver .env.example) si existe; si no, se usa un valor de desarrollo.
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-secret-please-change}

    # Volúmenes: Sincroniza tu carpeta actual con /app en el contenedor.
    # Esto permite que si cambias el código en tu PC, se actualice en Docker
    # sin tener que reconstruir la imagen (gracias al debug=True de Flask).
    # También es lo que hace que site.db (la base de datos SQLite) persista
    # entre reinicios del contenedor.
    volumes:
      - .:/app
